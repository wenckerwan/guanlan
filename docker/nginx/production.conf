# This file is loaded in nginx's http context (conf.d).
# Never use client-supplied XFF as a rate-limit key.
map $uri $guanlan_auth_limit_key {
  default "";
  ~^/api/v1/auth/(login|register|email/code)/?$ $binary_remote_addr;
}
map $uri $guanlan_visit_limit_key {
  default "";
  ~^/api/v1/stats/(visits|visit)/?$ $binary_remote_addr;
}
limit_req_zone $guanlan_auth_limit_key zone=guanlan_auth:10m rate=5r/m;
limit_req_zone $guanlan_visit_limit_key zone=guanlan_visits:10m rate=30r/m;

server {
  listen 80;
  server_name _;
  # Only the host-side OpenResty may supply a client address. Ignore forwarded
  # chains from arbitrary peers and build a fresh chain for the API.
  # Production guanlan_default bridge gateway; verify after network recreation.
  set_real_ip_from 172.18.0.1;
  real_ip_header X-Real-IP;
  server_tokens off;
  # Baseline CSP keeps Nuxt's inline bootstrap/styles working. No unsafe-eval,
  # external scripts, plugins, cross-origin framing, or cross-origin forms.
  # Move script-src to per-response nonces before removing unsafe-inline.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Browsers ignore HSTS over HTTP. Do not preload or affect other subdomains.
  add_header Strict-Transport-Security "max-age=31536000" always;
  proxy_hide_header X-Powered-By;
  limit_req_status 429;
  limit_req zone=guanlan_auth burst=10 nodelay;
  limit_req zone=guanlan_visits burst=20 nodelay;

  # 马原 API（/api/v2/）：前缀比 /api/ 更长，nginx 优先匹配此条，转发 mayuan-api。
  location /api/v2/ {
    proxy_pass http://mayuan-api:9501;
    proxy_cookie_flags mayuan_session secure httponly samesite=lax;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Main browser API must pass through the HttpOnly-session BFF. The PHP
  # service remains internal; do not expose its bearer-login endpoint publicly.
  location /api/v1/ {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # No generic API fallback may bypass the session boundary.
  location = /api/v1 { return 308 /api/v1/; }
  location /api/ { return 404; }

  # 马原知识宇宙前端（ssr:false SPA，app.baseURL=/mayuan/，Nuxt 监听 :3000/mayuan）。
  # proxy_pass 不带路径/尾斜杠：保留原始 /mayuan/... 前缀转发，与 Nuxt 挂载路径一致，避免 302 循环。
  location /mayuan/ {
    proxy_pass http://mayuan-web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
