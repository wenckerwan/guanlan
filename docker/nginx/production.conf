server {
  listen 80;
  server_name _;

  # 马原 API（/api/v2/）：前缀比 /api/ 更长，nginx 优先匹配此条，转发 mayuan-api。
  location /api/v2/ {
    proxy_pass http://mayuan-api:9501;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /api/ {
    proxy_pass http://api:9501;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 分析等长请求：默认 60s 会掐断 30s-1min 的分析
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # 马原知识宇宙前端（ssr:false SPA，app.baseURL=/mayuan/，Nuxt 监听 :3000/mayuan）。
  # proxy_pass 不带路径/尾斜杠：保留原始 /mayuan/... 前缀转发，与 Nuxt 挂载路径一致，避免 302 循环。
  location /mayuan/ {
    proxy_pass http://mayuan-web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}