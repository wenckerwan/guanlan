name: Release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. dev30-169eaa0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web bundle
        run: npm ci && npm run build
        working-directory: apps/web

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ghcr.io/wenckerwan/guanlan-api:${{ inputs.tag }} \
            -t ghcr.io/wenckerwan/guanlan-api:${{ github.sha }} .
          docker push ghcr.io/wenckerwan/guanlan-api:${{ inputs.tag }}
          docker push ghcr.io/wenckerwan/guanlan-api:${{ github.sha }}

      - name: Build and push Web image
        run: |
          mkdir -p /tmp/web-context/.output
          cp -a apps/web/.output/. /tmp/web-context/.output/
          docker build -f tools/deploy/web-artifact.Dockerfile \
            -t ghcr.io/wenckerwan/guanlan-web:${{ inputs.tag }} \
            -t ghcr.io/wenckerwan/guanlan-web:${{ github.sha }} /tmp/web-context
          docker push ghcr.io/wenckerwan/guanlan-web:${{ inputs.tag }}
          docker push ghcr.io/wenckerwan/guanlan-web:${{ github.sha }}
