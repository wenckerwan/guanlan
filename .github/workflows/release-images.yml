name: Release images

on:
  pull_request:
    paths:
      - '.github/workflows/release-images.yml'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'storage/**'
      - 'docker/nginx/production.conf'
      - 'tools/deploy/*analysis*'
      - 'tools/deploy/web-artifact.Dockerfile'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. dev30-169eaa0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web bundle
        run: npm ci && npm run build
        working-directory: apps/web

      - name: Build candidate API image
        run: |
          docker build -f apps/api/Dockerfile -t guanlan-api:release-check .

      - name: Build candidate Web image
        run: |
          mkdir -p /tmp/web-context/.output
          cp -a apps/web/.output/. /tmp/web-context/.output/
          docker build -f tools/deploy/web-artifact.Dockerfile \
            -t guanlan-web:release-check /tmp/web-context

      - name: Check candidate images through production gateway rules
        run: bash tools/deploy/check_analysis_images.sh guanlan-api:release-check guanlan-web:release-check

      - name: Publish verified images
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in api web; do
            for tag in "$RELEASE_TAG" "$RELEASE_SHA"; do
              remote="ghcr.io/wenckerwan/guanlan-$service:$tag"
              docker tag "guanlan-$service:release-check" "$remote"
              docker push "$remote"
            done
          done
