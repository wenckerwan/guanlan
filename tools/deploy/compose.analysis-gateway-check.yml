services:
  mysql:
    image: mysql:8.4
    # The rollback test creates a failure-injection trigger as the fixture user.
    command: ["--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: fixture-root
      MYSQL_DATABASE: guanlan_analysis_test
      MYSQL_USER: fixture
      MYSQL_PASSWORD: fixture-password
    tmpfs: [/var/lib/mysql]
    networks:
      default:
        aliases: [analysis-qa-db]
    healthcheck:
      test: [CMD, mysql, -h127.0.0.1, -ufixture, -pfixture-password, -Dguanlan_analysis_test, -e, "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 45
  redis:
    image: redis:7-alpine
  api:
    image: ${ANALYSIS_GATE_API:?set the candidate API image}
    volumes:
      - ${ANALYSIS_GATE_STORAGE:?set the fixture storage path}:/opt/guanlan/storage:ro
    environment:
      APP_ENV: production
      APP_KEY: fixture-key-local-to-the-release-check
      DB_HOST: mysql
      DB_DATABASE: guanlan_analysis_test
      DB_USERNAME: fixture
      DB_PASSWORD: fixture-password
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [CMD, php, -r, "exit(fsockopen('127.0.0.1', 9501) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 45
    networks:
      default:
        aliases: [mayuan-api]
  web:
    image: ${ANALYSIS_GATE_WEB:?set the candidate Web image}
    environment:
      NUXT_API_INTERNAL_BASE: http://api:9501/api/v1
    networks:
      default:
        aliases: [mayuan-web]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/]
      interval: 2s
      timeout: 5s
      retries: 30
  gateway:
    image: nginx:1.30.6-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ../../docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/api/v1/health]
      interval: 2s
      timeout: 5s
      retries: 30
