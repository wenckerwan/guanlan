services:
  api:
    build: ./apps/api
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: guanlan
      DB_USERNAME: guanlan
      DB_PASSWORD: change-me
      REDIS_HOST: redis
      SEARCH_HOST: http://meilisearch:7700
    volumes:
      - ./storage:/opt/guanlan/storage:ro
    depends_on: [mysql, redis, meilisearch]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && node .output/server/index.mjs"
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
    volumes:
      - ./apps/web:/app
    depends_on: [api]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: guanlan
      MYSQL_USER: guanlan
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me-root
    volumes: [mysql_data:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: change-me-search-key
    volumes: [search_data:/meili_data]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  mysql_data:
  redis_data:
  search_data:
